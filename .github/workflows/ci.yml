name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-checks:
    name: Local checks / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Update packaging tools
        run: python -m pip install --upgrade 'pip>=26.2' 'setuptools>=84.1'
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Check static types
        run: python -m pyright
      - name: Run local fixture and unit tests
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml --cov-report=html
      - name: Add coverage to workflow summary
        if: ${{ !cancelled() && hashFiles('.coverage') != '' }}
        run: python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Publish coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
          retention-days: 14

  dependency-audit:
    name: Dependency audit / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Update packaging tools
        run: python -m pip install --upgrade 'pip>=26.2' 'setuptools>=84.1'
      - name: Install project, development and audit dependencies
        run: python -m pip install -e ".[dev,audit]"
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Export exact audit inventories
        run: python scripts/export_audit_requirements.py --output-dir audit-results
      - name: Audit resolved Python environment
        run: >-
          python -m pip_audit -r audit-results/environment.txt
          --no-deps --disable-pip --strict --progress-spinner off
          --format json --output audit-results/environment.json
      - name: Audit pinned Python tool packages
        if: ${{ !cancelled() && hashFiles('audit-results/python-tools.txt') != '' }}
        run: >-
          python -m pip_audit -r audit-results/python-tools.txt
          --no-deps --disable-pip --strict --progress-spinner off
          --format json --output audit-results/python-tools.json
      - name: Audit Graphify dependency lock
        if: ${{ !cancelled() && hashFiles('audit-results/graphify-lock.txt') != '' }}
        run: >-
          python -m pip_audit -r audit-results/graphify-lock.txt
          --no-deps --disable-pip --strict --progress-spinner off
          --format json --output audit-results/graphify-lock.json
      - name: Publish audit inventories and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit-python-${{ matrix.python-version }}
          path: audit-results/
          if-no-files-found: warn
          retention-days: 14
