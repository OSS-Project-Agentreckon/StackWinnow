name: Opt-in macOS integration

on:
  workflow_dispatch:
    inputs:
      confirm_downloads:
        description: 'Run real upstream downloads and local no-paid-provider lifecycles (may take an hour)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  narrow-lifecycles:
    if: ${{ inputs.confirm_downloads }}
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require supported architecture
        run: |
          if [ "$(uname -m)" != arm64 ]; then
            echo 'This workflow requires an available macOS arm64 runner. No integration evidence was produced.'
            exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.13.1'
      - name: Install external Codex client
        run: |
          npm install --prefix "$RUNNER_TEMP/stackwinnow-client" @openai/codex@0.169.0
          echo "$RUNNER_TEMP/stackwinnow-client/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install manager and test dependencies
        run: python -m pip install '.[dev]'
      - name: Run existing narrow installed CLI lifecycles
        run: python -m pytest tests/integration/test_foundation_cli.py tests/integration/test_workflow_cli.py --run-integration -m 'not requires_provider' -ra
