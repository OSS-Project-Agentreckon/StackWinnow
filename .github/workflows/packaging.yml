name: Packaging

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manager-archives:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build dependencies
        run: python -m pip install 'build>=1.2,<2' 'setuptools>=77' wheel
      - name: Build committed source and check archive pair
        run: python scripts/build_release.py --source-ref HEAD --dist-dir dist --no-isolation
      - name: Verify hashes and clean wheel/source installs
        run: python scripts/build_release.py --source-ref HEAD --dist-dir dist --verify-only --install-check
