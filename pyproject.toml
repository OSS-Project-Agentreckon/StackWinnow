[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stackwinnow"
dynamic = ["version"]
description = "Project-aware selection and managed setup of open-source AI tools."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
stackwinnow = "stackwinnow.cli:main"

[project.urls]
Repository = "https://github.com/OSS-Project-Agentreckon/StackWinnow"
Issues = "https://github.com/OSS-Project-Agentreckon/StackWinnow/issues"

[tool.setuptools.dynamic]
version = {attr = "stackwinnow.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["stackwinnow", "stackwinnow.*"]
namespaces = false

[tool.setuptools.package-data]
stackwinnow = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
