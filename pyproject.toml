[build-system]
requires = ["setuptools>=84.1"]
build-backend = "setuptools.build_meta"

[project]
name = "stackwinnow"
dynamic = ["version"]
description = "Project-aware selection and managed setup of open-source AI tools."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["pydantic>=2.10,<3", "packaging>=24,<27"]

[project.optional-dependencies]
ui = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.27,<1", "anthropic>=0.40,<1"]
dev = [
    "build>=1.2,<2",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "pyright==1.1.414",
    "ruff>=0.9,<1",
]
audit = ["pip-audit>=2.9,<3"]

[project.scripts]
stackwinnow = "stackwinnow.cli:main"

[project.urls]
Repository = "https://github.com/OSS-Project-Agentreckon/StackWinnow"
Issues = "https://github.com/OSS-Project-Agentreckon/StackWinnow/issues"

[tool.setuptools.dynamic]
version = {attr = "stackwinnow.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["stackwinnow", "stackwinnow.*"]
namespaces = false

[tool.setuptools.package-data]
stackwinnow = ["data/*.json", "data/*.cjs", "data/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pyright]
include = ["src/stackwinnow", "scripts/export_audit_requirements.py"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.coverage.run]
source = ["stackwinnow"]
relative_files = true

[tool.coverage.report]
fail_under = 80
precision = 2
show_missing = true
skip_empty = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
